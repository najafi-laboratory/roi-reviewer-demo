site_name: roi-reviewer-demo
site_description: Build a self-contained ROI quality-control reviewer from any segmentation output
site_url: !ENV [SITE_URL, '']
repo_url: https://github.com/najafi-laboratory/roi-reviewer-demo
repo_name: najafi-laboratory/roi-reviewer-demo

theme:
  name: readthedocs

markdown_extensions:
  # md_in_html is required: every screenshot sits inside <div class="screenshot" markdown>
  # for styling, and without this extension the image syntax inside is left unrendered.
  - md_in_html
  - admonition
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Preparing Your Inputs: inputs.md
      - Build Configuration: configuration.md
      - CLI, Config and Interface: cli-mapping.md
  - The Reviewer:
      - Interface Tour: interface.md
      - Metric Reference: metrics.md
      - Export and Downstream Use: export.md
  - Reference:
      - Demo Sessions: demo-sessions.md
