name: Deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Build docs site
        env:
          SITE_URL: https://najafi-laboratory.github.io/roi-reviewer-demo/
        run: mkdocs build --strict

      # mkdocs --strict does not notice an image that was never rendered (for example
      # markdown inside an HTML block without md_in_html), so count them explicitly.
      - name: Every image in the docs is rendered and resolves
        run: |
          python - <<'PY'
          import glob, pathlib, re, sys
          failures = []
          for md in sorted(glob.glob("docs/*.md")):
              expected = len(re.findall(r"!\[[^\]]*\]\([^)]+\)", pathlib.Path(md).read_text()))
              stem = pathlib.Path(md).stem
              html = pathlib.Path("site/index.html" if stem == "index" else f"site/{stem}/index.html")
              text = html.read_text()
              srcs = re.findall(r'<img[^>]+src="([^"]+)"', text)
              missing = [s for s in srcs if not (html.parent / s).resolve().exists()]
              if len(srcs) != expected or missing or re.search(r"!\[[^\]]*\]\(", text):
                  failures.append(f"{stem}: expected {expected}, rendered {len(srcs)}, unresolved {missing}")
          if failures:
              sys.exit("\n".join(failures))
          print("all images rendered")
          PY

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
