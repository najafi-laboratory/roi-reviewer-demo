name: smoke

on: [push, pull_request]

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package and its dependencies
        run: pip install -e .

      - name: The generator must not depend on any laboratory package
        run: |
          python - <<'PY'
          import sys, importlib.abc

          class Block(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname == "utils_2p" or fullname.startswith("utils_2p."):
                      raise ImportError("utils_2p must not be imported")
                  return None

          sys.meta_path.insert(0, Block())
          import roi_reviewer.summary  # noqa: F401
          print("roi_reviewer imports with utils_2p blocked")
          PY

      - name: Build a synthetic session, convert it, and check the contract
        run: |
          python - <<'PY'
          import numpy as np, pathlib
          out = pathlib.Path("build/synthetic"); out.mkdir(parents=True, exist_ok=True)
          rng = np.random.default_rng(0)
          mask = np.zeros((128, 128), dtype=np.int32)
          mask[10:20, 20:35] = 1
          mask[60:72, 70:82] = 2
          np.save(out / "cell_masks.npy", mask)
          np.save(out / "traces.npy", rng.random((600, 2), dtype=np.float32))   # frames x ROIs, deliberately transposed
          np.save(out / "spikes.npy", np.abs(rng.normal(size=(2, 600))).astype("float32"))
          np.save(out / "mean_image.npy", rng.random((128, 128), dtype=np.float32))
          PY
          python scripts/make_standard_inputs.py \
            --masks build/synthetic/cell_masks.npy \
            --traces build/synthetic/traces.npy \
            --spikes build/synthetic/spikes.npy \
            --fov build/synthetic/mean_image.npy \
            --out build/session
          python scripts/validate_inputs.py build/session

      - name: A .npy where the reviewer expects HDF5 must be reported, not ignored
        run: |
          cp -r build/session build/stray
          rm build/stray/spikes.h5
          python -c "import numpy as np; np.save('build/stray/spikes.npy', np.zeros((2,600),dtype='float32'))"
          if python scripts/validate_inputs.py build/stray; then
            echo "validator failed to flag a stray spikes.npy"; exit 1
          fi

      - name: Generate a reviewer end to end
        run: |
          python -m roi_reviewer.summary build/session --output-dir build/out --roi-index-label "Original Index"
          test -f build/out/*_interactive_fov_roi_dff.html || (echo "no reviewer written"; exit 1)
          python - <<'PY'
          import glob, pathlib
          html = pathlib.Path(glob.glob("build/out/*_interactive_fov_roi_dff.html")[0]).read_text(errors="replace")
          for probe in ('"nRois":2', "Original Index", "referenceText"):
              assert probe in html, f"missing {probe!r} in generated reviewer"
          print("reviewer contains the expected payload")
          PY

      - name: Every config resolves
        run: |
          for cfg in config/*.yaml config/demo/*.yaml; do
            python scripts/build_reviewer.py "$cfg" --dry-run
          done

      - name: Each config field emits its documented flag, and typos fail
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, tempfile
          tmp = pathlib.Path(tempfile.mkdtemp())
          full = tmp / "full.yaml"
          full.write_text(
              "name: t\nsession_path: s\noutput_dir: o\ninput_layout: external_rois\n"
              "roi_index_label: Original Index\ntarget_structure: all_rois\n"
              "initialize_labels_from_model_scores: true\ncustom_roi_metrics: [a.csv, b.npy]\n"
              "pdf_name: p.pdf\nhtml_name: h.html\narchive_output: true\narchive_name: z.zip\n")
          out = subprocess.run([sys.executable, "scripts/build_reviewer.py", str(full), "--dry-run"],
                               capture_output=True, text=True, check=True).stdout
          for flag in ("--input-layout", "--roi-index-label", "--target-structure",
                       "--initialize-labels-from-roi-model-scores", "--pdf-name", "--html-name",
                       "--archive-output", "--archive-name"):
              assert flag in out, f"{flag} missing from: {out}"
          assert out.count("--custom-roi-metrics") == 2, out
          typo = tmp / "typo.yaml"
          typo.write_text("name: t\nsession_path: s\noutput_dir: o\ncustom_metrics: a.csv\n")
          r = subprocess.run([sys.executable, "scripts/build_reviewer.py", str(typo), "--dry-run"],
                             capture_output=True, text=True)
          assert r.returncode != 0 and "unrecognized" in (r.stdout + r.stderr), r
          print("config-to-flag mapping holds; unknown fields rejected")
          PY
